name: sdb-diffusion
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.9
  
  # PyTorch with CUDA
  - pytorch>=2.0.1
  - pytorch-cuda=12.4
  
  # Scientific computing
  - numpy>=1.24
  - scipy>=1.13
  
  # Machine learning
  - scikit-learn>=1.6
  
  # NetCDF support (for GEBCO data)
  - netcdf4>=1.7
  
  # Visualization
  - matplotlib>=3.7
  
  # Utilities
  - pyyaml>=6.0
  - tqdm
  - joblib>=1.4
  - pillow>=9.5
  
  # Pip dependencies
  - pip
  - pip:
    - earthengine-api>=1.4
    - opencv-python>=4.8
    - einops>=0.8
