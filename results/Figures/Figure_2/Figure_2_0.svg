<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11">

  <!-- Define gradient styles for more professional look -->
  <defs>
    <linearGradient id="data-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#fff9c4" />
    </linearGradient>
    <linearGradient id="stage-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1f5fe" />
      <stop offset="100%" stop-color="#b3e5fc" />
    </linearGradient>
    <linearGradient id="process-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="output-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5" />
      <stop offset="100%" stop-color="#e1bee7" />
    </linearGradient>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <style type="text/css">
      .stage-rect { fill: url(#stage-gradient); stroke: #0288d1; stroke-width: 1.5; filter: url(#drop-shadow); }
      .data-rect { fill: url(#data-gradient); stroke: #fbc02d; stroke-width: 1.5; filter: url(#drop-shadow); }
      .process-rect { fill: url(#process-gradient); stroke: #388e3c; stroke-width: 1.5; filter: url(#drop-shadow); }
      .output-rect { fill: url(#output-gradient); stroke: #7b1fa2; stroke-width: 1.5; filter: url(#drop-shadow); }
      .arrow-head { fill: #333; }
      .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; }
      .main-flow { stroke: #01579b; stroke-width: 2; }
      .text-label { fill: #333; text-anchor: middle; }
      .title-label { fill: #01579b; text-anchor: middle; font-weight: bold; font-size: 12px; }
      .section-ref { font-size: 9px; fill: #666; text-anchor: middle; }
      .data-flow { font-size: 9px; fill: #444; text-anchor: middle; font-style: italic;}
      .math-symbol { font-family: 'Times New Roman', serif; font-style: italic; }
      .annotation { font-size: 8px; fill: #555; text-anchor: middle; font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
    <marker id="main-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#01579b" />
    </marker>
  </defs>

  <!-- Chart title -->
  <text x="400" y="15" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">
    Hybrid S3GM-Bathymetry Framework: Workflow Architecture
  </text>

  <!-- Define element positions -->
  <g id="data-sources">
    <rect x="20" y="40" width="120" height="40" rx="5" ry="5" class="data-rect"/>
    <text x="80" y="65" class="text-label">Sentinel-2 Data</text>
    <rect x="160" y="40" width="120" height="40" rx="5" ry="5" class="data-rect"/>
    <text x="220" y="65" class="text-label">GEBCO Data</text>
    <rect x="300" y="40" width="120" height="40" rx="5" ry="5" class="data-rect"/>
    <text x="360" y="65" class="text-label">Nautical Charts</text>
    <rect x="440" y="40" width="120" height="40" rx="5" ry="5" class="data-rect"/>
    <text x="500" y="55" class="text-label">JRC GSW Data</text>
    <text x="500" y="70" class="text-label">(for Visualization)</text>
  </g>

  <g id="stage1-preprocessing">
    <rect x="20" y="120" width="540" height="60" rx="10" ry="10" class="stage-rect"/>
    <text x="290" y="140" class="title-label">Data Acquisition &amp; Preprocessing</text>
    <text x="290" y="155" class="section-ref">(Section 2)</text>
    <text x="80" y="170" class="text-label">SIAC, MIWC, Resample</text>
    <text x="220" y="170" class="text-label">Resampling &amp; Conversion</text>
    <text x="360" y="170" class="text-label">Filter, Normalize Coordinates</text>
    <text x="500" y="170" class="text-label">Binary Mask Generation</text>
  </g>

  <g id="stage2-rf">
    <rect x="20" y="220" width="260" height="80" rx="10" ry="10" class="stage-rect"/>
    <text x="150" y="240" class="title-label">Stage 1: Classic Model Prediction (RF)</text>
    <text x="150" y="255" class="section-ref">(Section 3.2)</text>
    <rect x="40" y="265" width="220" height="30" rx="5" ry="5" class="process-rect"/>
    <text x="150" y="283" class="text-label">Train RF &amp; Generate Preliminary Maps</text>
  </g>

  <g id="stage3-input-prep">
     <rect x="300" y="220" width="260" height="80" rx="10" ry="10" class="stage-rect"/>
     <text x="430" y="240" class="title-label">S3GM Input Preparation</text>
     <text x="430" y="255" class="section-ref">(Section 3.3.4)</text>
     <rect x="320" y="265" width="220" height="30" rx="5" ry="5" class="process-rect"/>
     <text x="430" y="283" class="text-label">Normalize &amp; Create Input Tensor</text>
  </g>

  <g id="stage4-s3gm">
     <rect x="20" y="350" width="540" height="120" rx="10" ry="10" class="stage-rect"/>
     <text x="290" y="370" class="title-label">Stage 2: S3GM Processing</text>
     <text x="290" y="385" class="section-ref">(Section 3.3)</text>
     <rect x="40" y="400" width="240" height="30" rx="5" ry="5" class="process-rect"/>
     <text x="160" y="418" class="text-label">Pre-training S3GM</text>
     <rect x="300" y="400" width="240" height="60" rx="5" ry="5" class="process-rect"/>
     <text x="420" y="418" class="text-label">Conditional Sampling</text>
     <text x="420" y="440" class="text-label">(Guided by Chart Data)</text>
     
     <!-- Annotation for pretraining purpose -->
     <text x="160" y="435" class="annotation">Learning spatial-temporal patterns</text>
     
     <!-- Annotation for conditional sampling -->
     <text x="420" y="465" class="annotation">Refining with high-accuracy measurements</text>
  </g>

   <g id="stage5-postprocessing">
     <rect x="20" y="510" width="540" height="80" rx="10" ry="10" class="stage-rect"/>
     <text x="290" y="530" class="title-label">Denormalization &amp; Validation</text>
     <text x="290" y="545" class="section-ref">(Section 3.5 &amp; 4)</text>
     <rect x="40" y="555" width="240" height="30" rx="5" ry="5" class="process-rect"/>
     <text x="160" y="573" class="text-label">Convert to Physical Depth Units (m)</text>
     <rect x="300" y="555" width="240" height="30" rx="5" ry="5" class="output-rect"/>
     <text x="420" y="573" class="text-label">Final Bathymetry Products &amp; Metrics</text>
  </g>

  <!-- Arrows and Data Flow Labels -->
  <!-- Data sources to Preprocessing -->
  <line x1="80" y1="80" x2="80" y2="120" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="220" y1="80" x2="220" y2="120" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="360" y1="80" x2="360" y2="120" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="500" y1="80" x2="500" y2="120" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Preprocessing outputs -->
  <line x1="80" y1="180" x2="80" y2="220" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="100" y="200" class="data-flow">Processed S2 Blue/Green</text>
  <line x1="360" y1="180" x2="150" y2="220" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="260" y="200" class="data-flow">Chart Depths (Training Target)</text>

  <!-- RF Output to Input Prep - Main flow -->
  <line x1="150" y1="300" x2="320" y2="265" class="arrow-line main-flow" marker-end="url(#main-arrow)"/>
  <text x="235" y="290" class="data-flow"><tspan class="math-symbol">D</tspan><tspan class="math-symbol" dy="2" font-size="8">RF</tspan> (RF Bathymetry)</text>

  <!-- Other Inputs to Input Prep - Adjusted position -->
  <line x1="220" y1="180" x2="340" y2="220" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="290" y="210" class="data-flow"><tspan class="math-symbol">D</tspan><tspan class="math-symbol" dy="2" font-size="8">GEBCO</tspan> (Prior)</text>
  <line x1="360" y1="180" x2="380" y2="220" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="385" y="210" class="data-flow">Chart Data (<tspan class="math-symbol">y</tspan><tspan class="math-symbol" dy="2" font-size="8">chart</tspan>, <tspan class="math-symbol">M</tspan>)</text>

  <!-- Input Prep to S3GM Pretraining - Adjusted for the new position -->
  <line x1="430" y1="300" x2="160" y2="350" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="295" y="330" class="data-flow">Normalized <tspan class="math-symbol">D</tspan><tspan class="math-symbol" dy="2" font-size="8">RF</tspan>, <tspan class="math-symbol">D</tspan><tspan class="math-symbol" dy="2" font-size="8">GEBCO</tspan></text>

  <!-- Pretraining Output - Main flow -->
  <line x1="160" y1="430" x2="300" y2="415" class="arrow-line main-flow" marker-end="url(#main-arrow)"/>
  <text x="230" y="430" class="data-flow">Pre-trained S3GM Model</text>

  <!-- Input Prep to S3GM Conditional Sampling - Adjusted -->
  <line x1="430" y1="300" x2="420" y2="400" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="460" y="350" class="data-flow">Chart Conditioning Data</text>

  <!-- S3GM Output to Postprocessing - Main flow -->
  <line x1="420" y1="460" x2="160" y2="510" class="arrow-line main-flow" marker-end="url(#main-arrow)"/>
  <text x="290" y="490" class="data-flow">Generated Bathymetry Tensor <tspan class="math-symbol">x</tspan></text>

  <!-- Denorm to Final Output - Main flow -->
  <line x1="160" y1="585" x2="300" y2="570" class="arrow-line main-flow" marker-end="url(#main-arrow)"/>
  <text x="230" y="585" class="data-flow">Physical Depths (m)</text>

  <!-- Land Mask to Viz (dashed line) - Adjusted -->
  <line x1="500" y1="180" x2="500" y2="555" class="arrow-line" stroke-dasharray="5, 5" marker-end="url(#arrow)"/>
  <text x="515" y="370" class="data-flow" transform="rotate(90 515,370)">Land/Water Mask (Visualization)</text>

  <!-- Legend -->
  <rect x="600" y="450" width="180" height="130" rx="5" ry="5" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="690" y="470" text-anchor="middle" font-weight="bold" fill="#333">Legend</text>
  
  <rect x="620" y="480" width="20" height="15" fill="url(#data-gradient)" stroke="#fbc02d" stroke-width="1"/>
  <text x="650" y="490" fill="#333" text-anchor="start" font-size="9">Input Data</text>
  
  <rect x="620" y="505" width="20" height="15" fill="url(#stage-gradient)" stroke="#0288d1" stroke-width="1"/>
  <text x="650" y="515" fill="#333" text-anchor="start" font-size="9">Processing Stage</text>
  
  <rect x="620" y="530" width="20" height="15" fill="url(#process-gradient)" stroke="#388e3c" stroke-width="1"/>
  <text x="650" y="540" fill="#333" text-anchor="start" font-size="9">Process Step</text>
  
  <rect x="620" y="555" width="20" height="15" fill="url(#output-gradient)" stroke="#7b1fa2" stroke-width="1"/>
  <text x="650" y="565" fill="#333" text-anchor="start" font-size="9">Final Output</text>
  
  <line x1="620" y1="575" x2="640" y2="575" class="arrow-line main-flow" marker-end="url(#main-arrow)"/>
  <text x="680" y="578" fill="#333" text-anchor="start" font-size="9">Primary Data Flow</text>

</svg>