# Basic model parameters
num_components: 5  # 1(classic) + 1(GEBCO) + 2(chart) + 1(mask)
image_size: 64
num_frames: 6     # 2018-2023
version: "bathymetry_v0"
data: "bathymetry"
parameterization: "v"

# Model architecture parameters
model_channels: 128
num_res_blocks: 4
attention_resolutions: [4, 8, 16]
dropout: 0.2
channel_mult: [1, 2, 4, 4]
dims: 2
num_heads: 8
use_checkpoint: true
use_scale_shift_norm: true

# Channel modal configuration
channel_modal: [1, 1, 2, 1]  # [classic model, GEBCO, chart(depth+mask), unified mask]
num_modals: 1

# SDE configuration
sde_type: 'vpsde'  # Specify using VPSDE
beta_min: 0.1
beta_max: 1000
num_scales: 1000

# Diffusion model parameters
ema_rate: 0.999
predictor: reverse_diffusion
corrector: langevin
probability_flow: true

# Sampling parameters
sampling:
  alpha: 0.1
  gamma1: 0 
  gamma2: 0
  gamma_spatial: 5.0e-7
  inner_loop: 1
  snr: 0.01
  continuous: true
  num_steps: 3 
  overlap: 2

# RPE related parameters
beta: 32
use_rpe_net: true
time_embed_dim: 256

# Temporal processing parameters
time_decay: 0.12
spatial_decay: 0.05

# Performance optimization parameters
use_fp16: true
use_amp: true
memory_efficient: true
gradient_checkpointing: true
use_reentrant: false
batch_size_override: 1
requires_grad: true

# EMA related parameters
use_ema: true
ema_decay: 0.9999

# VESDE parameters
sigma_min: 0.002
sigma_max: 10

# Numerical stability parameters
eps: 1.0e-12

# Sampling parameters
num_samples: 1
num_samples_train: 1000
num_samples_val: 1000
train_split: 0.9

# Data processing parameters
land_value: 1.5

# Physics constraint parameters
physics_guide: false

# Stability parameters
stability:
  grad_clip: 100.0
  check_grad_interval: 5
  debug: true
  monitor_data_ranges: true
  x0_hat_clamp: true
  score_clamp_range: 20.0
  gradient_clip_dps: 10.0

# Clipping parameters
clipping:
  use_dynamic: true
  percentile_range: [1, 99]
  expansion_factor: 1.2
  land_threshold: 0.1

# Weight parameters
weights:
  spatial_min: 0.3
  spatial_max: 1.0
  temporal_min: 0.2
  temporal_max: 1.0

# Range adaptation configuration
range_adaptation:
  enabled: true
  use_mixed_activation: true
  land_value: 1.5
  init_scale: 1.0
  init_shift: 0.0
  attention_scale_factor: 0.8

# Input channel weights
input_weights:
  classic: 0.7
  gebco: 0.3
