# Bathymetry Inversion Classic Model Parameter Configuration

# Log-transformed Linear Model (LLM) parameters
llm_params:
  a0: 0.0  # Intercept
  a1: 1.0  # Blue band coefficient
  a2: 1.0  # Green band coefficient
  R_inf:
    blue: 0.0  # Blue band deep water reflectance
    green: 0.0  # Green band deep water reflectance

# Random Forest Model (RF) parameters
rf_params:
  # Model structure parameters
  model_params:
    n_estimators: 500        # Number of trees
    max_depth: 25           # Maximum depth
    min_samples_split: 2    # Minimum samples required to split
    min_samples_leaf: 1     # Minimum samples at leaf node
    max_features: 'sqrt'    # Feature selection method
    bootstrap: true         # Use bootstrap sampling
    random_state: 42        # Random seed
    n_jobs: -1             # Parallel processing
    oob_score: true        # Enable out-of-bag score

  # Feature engineering parameters
  feature_engineering:
    normalization:
      use_standard_scaling: true  # Use standard scaling
    
    band_ratio:
      use_log_transform: true    # Use log transform
    
    depth_index:
      use_normalized_bands: true # Use normalized bands

  # Feature importance (updated during training)
  feature_importances:
    blue: 0.0
    green: 0.0
    band_ratio: 0.0
    log_blue: 0.0
    log_green: 0.0
    log_ratio: 0.0
    depth_index: 0.0

# Log-transformed Ratio Model (LRM) parameters
lrm_params:
  m0: 0.0  # Offset coefficient
  m1: 1.0  # Ratio coefficient
  n: 1000.0  # Fixed constant

# Data preprocessing parameters
preprocessing:
  deep_water_percentile: 90  # Deep water percentile (for LLM)
  outlier_threshold: 2.5     # Outlier threshold (standard deviation multiplier)
  min_depth: 0.1            # Minimum depth (meters)
  max_depth: 75.0           # Maximum depth (meters)
  depth_limits:
    min_depth: 0.1       # Minimum depth (meters)
    max_depth: 75.0      # Maximum depth (meters)
  
  data_validation:
    depth_range:
      min_depth: 0.1     # Minimum depth (meters)
      max_depth: 75.0    # Maximum depth (meters)
    band_values:
      min_value: 0.0     # Band minimum value
      remove_negatives: true  # Remove negative values

# Training parameters
training:
  train_ratio: 0.8       # Training data ratio
  validation_ratio: 0.1  # Validation data ratio
  random_seed: 42        # Random seed
  early_stopping:
    patience: 10         # Early stopping patience
    min_delta: 0.001    # Minimum improvement threshold

# Logging parameters
logging:
  log_feature_importance: true    # Log feature importance
  log_training_stats: true        # Log training statistics
  log_prediction_stats: true      # Log prediction statistics